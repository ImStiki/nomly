<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7B4DFF" />
    <meta name="description" content="Nomly — food and grocery delivery from the best restaurants and stores near you." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Nomly — Food & grocery delivery</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var p = JSON.parse(localStorage.getItem('nomly-prefs') || '{}').state || {};
        var dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
